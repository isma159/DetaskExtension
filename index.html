<!DOCTYPE html>
<html>

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="output.css" rel="stylesheet">
    </head>
    <body class="flex h-[550px] w-[450px] flex-col bg-slate-50 font-sans text-slate-800 antialiased">
        <div id="login-view" class="flex flex-grow flex-col justify-center items-center">
            <div id="login-box" class="flex w-11/12 flex-col justify-center rounded-lg border border-slate-200 bg-white p-5 shadow-sm">
                <h3 class="mb-4 text-center text-lg font-bold text-slate-900">Log In</h3>
                <input type="text" id="signInUserField" placeholder="Username" class="mb-3 rounded-md border border-slate-300 px-3 py-2 text-sm placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
                <input type="password" id="signInPassField" placeholder="Password" class="mb-4 rounded-md border border-slate-300 px-3 py-2 text-sm placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
                <input id="signInBtn" type="button" value="Log In" class="w-full cursor-pointer rounded-md bg-green-400 px-4 py-2 font-medium text-white transition-colors hover:bg-green-500">
            </div>
        </div>

        <div id="main-view" class="hidden flex flex-grow flex-col">
            <div id="headerBar" class="flex items-center justify-between bg-green-400 p-3 text-white shadow-md w-full">
                <h3 id="Title" class="text-lg font-bold">Detask</h3>
                <button class="rounded-md bg-green-600 px-3 py-1 text-sm font-medium transition-colors hover:bg-green-700">⚙</button>
            </div>

            <div class="flex flex-grow flex-col p-3">
                <!-- New Tab Navigation -->
                <div class="mb-4 flex rounded-lg bg-white p-1 shadow-sm">
                    <button class="tab-button flex-1 rounded-md px-4 py-2 text-sm font-medium text-slate-600 transition-colors hover:bg-green-400 hover:text-green-700" data-tab="health">
                        Health
                    </button>
                    <button class="tab-button flex-1 rounded-md px-4 py-2 text-sm font-medium text-slate-600 transition-colors hover:bg-green-400 hover:text-green-700" data-tab="events">
                        Events
                    </button>
                </div>

                <!-- New Tab Content -->
                <div id="tab-content-container" class="flex-grow rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
                    <div id="health-content" class="tab-content">
                        <h4 class="mb-4 text-lg font-semibold text-slate-900">Health Overview</h4>
                        <div id="survey-container" class="mt-4 p-4 border rounded-lg shadow-sm bg-gray-50">
                            <div id="survey-question-display" class="mb-4 text-lg font-medium text-slate-800">
                                <!-- Question will be inserted here by JavaScript -->
                            </div>
                            <div id="survey-options" class="flex flex-col space-y-2 mb-4">
                                <!-- Radio buttons will be inserted here by JavaScript -->
                            </div>
                            <button id="submit-answer" class="w-full rounded-md bg-green-400 px-4 py-2 font-medium text-white transition-colors hover:bg-green-500">
                                Submit Answer
                            </button>
                            <div id="survey-result" class="mt-4 text-center text-xl font-bold text-slate-900 hidden">
                                <!-- Final score will be displayed here -->
                            </div>
                        </div>
                    </div>
                    <div id="events-content" class="tab-content hidden">
                        <h4 class="mb-2 text-md font-semibold text-slate-900">Upcoming Events</h4>
                        <p class="text-sm text-slate-700">See your scheduled events.</p>
                    </div>
                </div>
            </div>

            <!-- Survey Progress Bar (always visible at the bottom of main-view) -->
            <div id="survey-progress-container" class="mt-auto p-4 border rounded-lg shadow-sm bg-gray-50 mx-5 mb-1">
                <div class="flex items-center justify-between mb-1">
                    <span class="text-base font-bold text-slate-800">Survey Progress:</span>
                    <span id="survey-progress-text" class="text-lg font-extrabold text-slate-900">0%</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2.5 mb-2">
                    <div id="survey-progress-bar" class="h-2.5 rounded-full bg-green-400 transition-all duration-500 ease-in-out" style="width: 0%;"></div>
                </div>
                <div class="flex items-center justify-between">
                    <span class="text-base font-bold text-slate-800">Daily Survey:</span>
                    <span id="daily-survey-status" class="text-base font-semibold text-red-700">Not Taken</span>
                </div>
            </div>
        </div>
        <script src="app.js"></script>
    </body>
</html>
