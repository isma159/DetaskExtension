<!DOCTYPE html>
<html>

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="output.css" rel="stylesheet">
    </head>
    <body class="flex h-[550px] w-[450px] flex-col bg-slate-50 font-sans text-slate-800 antialiased">
        <div id="login-view" class="flex flex-grow flex-col justify-center items-center">
            <div id="login-box" class="flex w-11/12 flex-col justify-center rounded-lg border border-slate-200 bg-white p-5 shadow-sm">
                <h3 class="mb-4 text-center text-lg font-bold text-slate-900">Log In</h3>
                <input type="text" id="signInUserField" placeholder="Username" class="mb-3 rounded-md border border-slate-300 px-3 py-2 text-sm placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
                <input type="password" id="signInPassField" placeholder="Password" class="mb-4 rounded-md border border-slate-300 px-3 py-2 text-sm placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
                <input id="signInBtn" type="button" value="Log In" class="w-full cursor-pointer rounded-md bg-blue-600 px-4 py-2 font-medium text-white transition-colors hover:bg-blue-700">
            </div>
        </div>

        <div id="main-view" class="hidden flex flex-grow flex-col">
            <div id="headerBar" class="flex items-center justify-between bg-blue-600 p-3 text-white shadow-md w-full">
                <h3 id="Title" class="text-lg font-bold">Detask</h3>
                <button class="rounded-md bg-blue-700 px-3 py-1 text-sm font-medium transition-colors hover:bg-blue-800">⚙</button>
            </div>

            <div class="flex flex-grow flex-col p-3">
                <!-- New Tab Navigation -->
                <div class="mb-4 flex rounded-lg bg-white p-1 shadow-sm">
                    <button class="tab-button flex-1 rounded-md px-4 py-2 text-sm font-medium text-slate-600 transition-colors hover:bg-blue-50 hover:text-blue-700" data-tab="health">
                        Health
                    </button>
                    <button class="tab-button flex-1 rounded-md px-4 py-2 text-sm font-medium text-slate-600 transition-colors hover:bg-blue-50 hover:text-blue-700" data-tab="events">
                        Events
                    </button>
                </div>

                <!-- New Tab Content -->
                <div id="tab-content-container" class="flex-grow rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
                    <div id="health-content" class="tab-content">
                        <h4 class="mb-2 text-md font-semibold text-slate-900">Health Overview</h4>
                        <p class="text-sm text-slate-700">Track your health metrics here.</p>
                    </div>
                    <div id="events-content" class="tab-content hidden">
                        <h4 class="mb-2 text-md font-semibold text-slate-900">Upcoming Events</h4>
                        <p class="text-sm text-slate-700">See your scheduled events.</p>
                    </div>
                </div>
            </div>
        </div>
        <script src="app.js"></script>
    </body>

</html>
